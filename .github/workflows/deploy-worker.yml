name: Deploy Agency

on:
  push:
    branches:
      - main

jobs:
  deploy:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 19 Oct 2026; deploys were last proven on 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      # chatbot-api first: crm-api binds to its LlmService entrypoint
      - name: Deploy Worker (API)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # wrangler.jsonc needs Wrangler >= 3.91; the action defaults to 3.90
          wranglerVersion: '4.149.0'
          workingDirectory: 'chatbot-api'

      - name: Deploy CRM API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.149.0'
          workingDirectory: 'bytes-website/crm-api-worker'
          # Name the config: without it Wrangler 4 picks the root wrangler.jsonc and deploys the website here
          command: deploy --config wrangler.toml

      - name: Build Website
        working-directory: 'bytes-website'
        run: |
          npm install
          npm run build
          
      - name: Deploy Website (Dashboard & Widget)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.149.0'
          # The root wrangler.jsonc now points to bytes-website/dist
