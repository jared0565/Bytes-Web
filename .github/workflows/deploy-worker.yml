name: Deploy Agency

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # chatbot-api first: crm-api binds to its LlmService entrypoint
      - name: Deploy Worker (API)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # wrangler.jsonc needs Wrangler >= 3.91; the action defaults to 3.90
          wranglerVersion: '4.70.0'
          workingDirectory: 'chatbot-api'

      - name: Deploy CRM API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'bytes-website/crm-api-worker'
          
      - name: Build Website
        working-directory: 'bytes-website'
        run: |
          npm install
          npm run build
          
      - name: Deploy Website (Dashboard & Widget)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.70.0'
          # The root wrangler.jsonc now points to bytes-website/dist
