name = "crm-api"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret config vars — safe to commit
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:3000,https://bytes-website.bmorris0565.workers.dev"
AUTH_REDIRECT_URL = "https://crm-api.bmorris0565.workers.dev/api/auth/{{provider}}/callback"
FRONTEND_ONBOARDING_URL = "https://bytes-website.bmorris0565.workers.dev/onboarding/"

# D1 SQLite database (shared with chatbot-api — contains leads + chat_logs)
[[d1_databases]]
binding = "DB"
database_name = "chatbot-db"
database_id = "83348fa4-873f-4b07-b372-6a6e3b0896b6"

# KV namespace for short-lived OAuth exchange tokens (5-min TTL, single-use)
[[kv_namespaces]]
binding = "OAUTH_TOKENS"
id = "8ad06a763d6745d1bbbbd7fce1f4eb6c"
preview_id = "8ad06a763d6745d1bbbbd7fce1f4eb6c"

# Cron trigger — runs the verification email follow-up worker every minute
[triggers]
crons = ["* * * * *"]

# Secrets (set via `wrangler secret put <NAME>`, never stored here):
# ADMIN_SECRET
# JWT_SECRET
# OAUTH_STATE_SECRET
# GEMINI_API_KEY
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# FACEBOOK_CLIENT_ID
# FACEBOOK_CLIENT_SECRET
# LINKEDIN_CLIENT_ID
# LINKEDIN_CLIENT_SECRET
