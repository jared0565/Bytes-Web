<!-- Source of public/og-home.jpg, the link-preview image for the homepage and the legal pages.

     `npx vite --port 4174`, open /og-src/home.html at 1200x630, wait for document.fonts.ready, then
     screenshot as JPEG quality 88 (about 80 KB; as PNG the grain makes it about 680 KB, and WhatsApp is
     reported to drop previews over about 300 KB). Save under a new name so platforms fetch it fresh.
     X shows only this image (no title or description), so the offer has to be in the picture. -->
